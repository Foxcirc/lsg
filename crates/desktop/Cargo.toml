[package]
name = "desktop"
version.workspace = true
edition.workspace = true
authors.workspace = true

[lib]
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "wasm"
path = "src/browser/test/wasm.rs"

[features]
default = []
export = []
import = []

[dependencies]
common = { path = "../common" }

[target.'cfg(target_os = "linux")'.dependencies]
# wayland deps
wayland-client = { version = "0.31.14", features = ["system"] }
wayland-protocols = { version = "0.31.2", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.2.0", features = ["client", "wayland-client"] }
xkbcommon = { version = "0.7.0", features = ["wayland"]}
# other
nix = { version = "0.28.0", features = ["mman", "fs", "process"] }
bv = "0.11.1" # bitvecs
# async/futures deps
futures-lite = "2.3.0"
async-io = "2.3.2"
async-signals = { version = "0.4.0" }
